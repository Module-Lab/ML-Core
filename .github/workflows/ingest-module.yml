name: Ingest module (store gate)

# Гейт для PR в публичный стор: проверяет подписанные модули, ничего не подписывая сам.
# Для каждого изменённого jar в store/modules/** прогоняет .ci/VerifyModule:
#   хеш==сайдар, keyId/хеш не отозваны, автор заверён (authors/<keyId>/cert.json),
#   подпись jar ключом автора, rootSignature сертификата проходит корню из trust.json.
# Публичный реп, секретов не требует. Красный -> PR не мержим (модуль не пройдёт доверие).

on:
  pull_request:
    paths:
      - 'store/modules/**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify signature, hash, author cert, revocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile gate verifier
        run: javac -d build/ci .ci/VerifyModule.java

      - name: Verify each changed module jar
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          mapfile -t JARS < <(git diff --name-only "$base"...HEAD -- 'store/modules/**/*.jar' || true)
          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "Изменённых jar в store/modules нет — нечего проверять."
            exit 0
          fi
          rc=0
          for j in "${JARS[@]}"; do
            echo "======== $j ========"
            java -cp build/ci VerifyModule "$j" store || rc=1
          done
          echo "---- проверено модулей: ${#JARS[@]} ----"
          exit "$rc"
